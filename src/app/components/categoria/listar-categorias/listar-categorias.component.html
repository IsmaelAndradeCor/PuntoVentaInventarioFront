<div class="component-page">
    @if (!categorias.length) {
    <p>No existen Categorias Activas</p>
    }
    @else if (categorias) {
    <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
        <div class="input-group" style="max-width: 350px;">
            <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="textoBusqueda" (input)="filtrarTabla()">
            <button class="btn btn-danger" type="button" (click)="limpiarTextoBusqueda()"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </div>
    @if (textoBusqueda && !categoriasFiltradas.length) {
    <p>No existen Categorias con ese nombre.</p>
    }
    @else {
    <div class="form-section-fill">
        <div class="table-scroll">
            <table class="table table-sm table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th *appHasPermission="['categorias.actualizar', 'categorias.desactivar']" style="width: 10%; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let i of categoriasFiltradas; index as j">
                        <td>{{i.nombre}}</td>
                        <td *appHasPermission="['categorias.actualizar', 'categorias.desactivar']" style="width: 10%; text-align: center;">
                            <div class="d-flex align-items-center justify-content-center gap-3">

                                <button *appHasPermission="'categorias.actualizar'" class="btn btn-sm btn-warning" type="button" (click)="mostrarModalActualizarPorId(i.id)"><i class="fa-solid fa-pen-to-square"></i></button>                     
                                <button *appHasPermission="'categorias.desactivar'" class="btn btn-sm btn-danger" type="button" (click)="mostrarModalConfirmarDesactivar(i.id)"><i class="fa-solid fa-trash"></i></button> 
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    }
    }

</div>

<app-actualizar-categoria
    *ngIf="mostrarActualizar"
    [objetoActualizar]="objetoActualizar"
    [mostrarActualizar]="mostrarActualizar"
    (cerrarModal)="cerrarModalActualizar()"
    (objetoActualizado)="actualizarEnLista($event)"
></app-actualizar-categoria>

<app-confirmar-modal
  *ngIf="mostrarDesactivar"
  [mostrarConfirmar]="mostrarDesactivar"
  [titulo]="'Confirmar desactivación de '+ nombreDesactivar"
  [mensaje]="'¿Deseas desactivar esta Categoria?'"
  [id]="idDesactivar!"
  (confirmarModal)="desactivarPorId($event)"
  (cerrarModal)="cerrarModalConfirmar()"
></app-confirmar-modal>

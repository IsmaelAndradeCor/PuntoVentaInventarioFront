<div class="component-page">
    <div class="form-section-fill">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-6 col-xl-3">
                <div class="input-group">
                    <span class="input-group-text">Identificador</span>
                    <input
                        class="form-control"
                        type="text"
                        [(ngModel)]="upsertUsuario.userName"
                        name="user">
                </div>
            </div>

            <div class="col-12 col-md-6 col-xl-3">
                <div class="input-group">
                    <span class="input-group-text">Contraseña</span>
                    <input
                        class="form-control"
                        type="password"
                        [(ngModel)]="upsertUsuario.password"
                        name="password">
                </div>
            </div>

            <div class="col-12 col-md-6 col-xl-4">
                <div class="input-group">
                    <span class="input-group-text">Nombre Completo</span>
                    <input
                        class="form-control"
                        type="text"
                        [(ngModel)]="upsertUsuario.nombreCompleto"
                        name="nombreCompleto">
                </div>
            </div>

            <div class="col-12 col-md-6 col-xl-2">
                <div class="input-group">
                    <span class="input-group-text">Rol</span>
                    <input
                        class="form-control"
                        type="text"
                        [(ngModel)]="upsertUsuario.rol"
                        name="rol">
                </div>
            </div>

            <div class="col-12 d-grid d-md-flex justify-content-md-end">
                <button class="btn btn-success px-4" type="button" (click)="postUsuario()">
                    Crear Usuario
                </button>
            </div>
        </div>
    </div>
</div>

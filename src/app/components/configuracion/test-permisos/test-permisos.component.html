<div class="component-page">
  <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
    <div class="input-group" style="max-width: 350px;">
      <input type="text" class="form-control" placeholder="Buscar por usuario o nombre">
      <button class="btn btn-danger" type="button">
        <i class="fa-solid fa-eraser"></i>
      </button>
    </div>
  </div>

  <div class="form-section-fill">
    <div class="permissions-scroll">
      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-5 g-4">
        @for (modulo of catalogo; track modulo.key) {
          <div class="col">
            <div class="card h-100">
              <div class="card-header">
                <label class="form-check-label d-flex align-items-center gap-2">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [checked]="tiene(modulo.permission)"
                    (change)="toggle(modulo.permission, $any($event.target).checked)" />
                  <strong>{{ modulo.titulo }}</strong>
                </label>
              </div>

              @if (modulo.hijos.length > 0) {
                <div class="card-body">
                  @for (hijo of modulo.hijos; track hijo.key) {
                    <div class="mb-2">
                      <label class="form-check-label d-flex align-items-center gap-2">
                        <input
                          type="checkbox"
                          class="form-check-input"
                          [checked]="tiene(hijo.permission)"
                          (change)="toggle(hijo.permission, $any($event.target).checked)" />
                        {{ hijo.titulo }}
                      </label>

                      @if (hijo.hijos.length > 0) {
                        <div class="ms-4 mt-2">
                          @for (nieto of hijo.hijos; track nieto.key) {
                            <div class="mb-1">
                              <label class="form-check-label d-flex align-items-center gap-2">
                                <input
                                  type="checkbox"
                                  class="form-check-input"
                                  [checked]="tiene(nieto.permission)"
                                  (change)="toggle(nieto.permission, $any($event.target).checked)" />
                                {{ nieto.titulo }}
                              </label>
                            </div>
                          }
                        </div>
                      }
                    </div>
                  }
                </div>
              } @else {
                <div class="card-body p-2">
                  <div class="d-flex align-content-center">
                    No hay subpermisos que otorgar
                  </div>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>

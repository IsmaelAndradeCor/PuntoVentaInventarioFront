<div class="component-page">
    @if (!rolesDto.length) {
    <p>No existen Roles Inactivos</p>
    }
    @else if (rolesDto) {
    <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
        <div class="input-group" style="max-width: 350px;">
            <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="textoBusqueda" (input)="filtrarTabla()">
            <button class="btn btn-danger" type="button" (click)="limpiarTextoBusqueda()"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </div>
    @if (textoBusqueda && !rolesFiltrados.length) {
    <p>No existen Roles Inactivos con ese nombre.</p>
    }
    @else {
    <div class="form-section-fill">
        <table class="table table-sm table-striped table-bordered">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Administrador</th>
                    <th *ngIf="puedeActivar()">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of rolesFiltrados; trackBy: trackByRolId">
                    <td>{{r.nombre}}</td>
                    <td>
                        @if (r.esAdmin) {
                            <span class="badge bg-success">Sí</span>
                        } @else {
                            <span class="badge bg-secondary">No</span>
                        }
                    </td>
                    <td *ngIf="puedeActivar()">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <button class="btn btn-sm btn-success" type="button" (click)="mostrarModalConfirmarActivar(r.id)">Activar</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    }
    }
</div>

<app-confirmar-modal
  *ngIf="mostrarConfirmarActivar"
  [mostrarConfirmar]="mostrarConfirmarActivar"
  [titulo]="'Confirmar activación de ' + (rolesPorId.get(idRolActivar ?? '')?.nombre ?? '')"
  [mensaje]="'¿Deseas activar este rol?'"
  [id]="0"
  (confirmarModal)="activarRol(idRolActivar ?? '')"
  (cerrarModal)="cerrarModalConfirmar()"
></app-confirmar-modal>

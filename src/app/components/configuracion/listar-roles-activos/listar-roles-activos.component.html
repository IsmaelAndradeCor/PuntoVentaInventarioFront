<div class="component-page">
    @if (!rolesDto.length) {
    <p>No existen Roles Activos</p>
    }
    @else if (rolesDto) {
    <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
        <div class="input-group" style="max-width: 350px;">
            <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="textoBusqueda" (input)="filtrarTabla()">
            <button class="btn btn-danger" type="button" (click)="limpiarTextoBusqueda()"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </div>
    @if (textoBusqueda && !rolesFiltrados.length) {
    <p>No existen Roles Activos con ese nombre.</p>
    }
    @else {
    <div class="form-section-fill">
        <table class="table table-sm table-striped table-bordered">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Administrador</th>
                    <th *ngIf="puedeActualizar() || puedeDesactivar()">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of rolesFiltrados; trackBy: trackByRolId">
                    <td>{{r.nombre}}</td>
                    <td>
                        @if (r.esAdmin) {
                            <span class="badge bg-success">Sí</span>
                        } @else {
                            <span class="badge bg-secondary">No</span>
                        }
                    </td>
                    <td *ngIf="puedeActualizar() || puedeDesactivar()">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <button *ngIf="puedeActualizar()" class="btn btn-sm btn-warning" type="button" (click)="abrirModalActualizar(r)">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button *ngIf="puedeDesactivar()" class="btn btn-sm btn-danger" type="button" (click)="mostrarModalConfirmarDesactivar(r.id)">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    }
    }
</div>

<app-actualizar-rol
  *ngIf="mostrarActualizarRol"
  [rolActualizar]="rolActualizar"
  [mostrarActualizarRol]="mostrarActualizarRol"
  (cerrarModal)="cerrarModalActualizar()"
  (objetoActualizado)="actualizarEnLista($event)"
></app-actualizar-rol>

<app-confirmar-modal
  *ngIf="mostrarConfirmarDesactivar"
  [mostrarConfirmar]="mostrarConfirmarDesactivar"
  [titulo]="'Confirmar desactivación de ' + (rolesPorId.get(idRolDesactivar ?? '')?.nombre ?? '')"
  [mensaje]="'¿Deseas desactivar este rol?'"
  [id]="0"
  (confirmarModal)="desactivarRol(idRolDesactivar ?? '')"
  (cerrarModal)="cerrarModalConfirmar()"
></app-confirmar-modal>

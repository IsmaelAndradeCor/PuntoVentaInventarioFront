<div class="component-page">
    @if (!unidadesMedida.length) {
    <p>No existen Unidades de Medida</p>
    }
    @else if (unidadesMedida) {
    <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
        <div class="input-group" style="max-width: 350px;">
            <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="textoBusqueda" (input)="filtrarTabla()">
            <button class="btn btn-danger" type="button" (click)="limpiarTextoBusqueda()"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </div>
    @if (textoBusqueda && !unidadesMedidaFiltradas.length) {
    <p>No existen Unidades de Medida con ese nombre.</p>
    }
    @else {
    <div class="form-section-fill">
        <div class="table-scroll">
            <table class="table table-sm table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Clave</th>
                        <th>Permite decimales</th>
                        <th *appHasPermission="'unidadesmedida.activar'" style="width: 10%; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let i of unidadesMedidaFiltradas; index as j">
                        <td>{{i.nombre}}</td>
                        <td>{{i.clave}}</td>
                        <td>{{i.permiteDecimales}}</td>
                        <td *appHasPermission="'unidadesmedida.activar'" style="width: 10%; text-align: center;">
                            <div class="d-flex align-items-center justify-content-center gap-3">
                                <button *appHasPermission="'unidadesmedida.activar'" class="btn btn-sm btn-success" type="button" (click)="mostrarModalConfirmarActivar(i.id)">Activar</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    }
    }
</div>

<app-confirmar-modal
  *ngIf="mostrarActivar"
  [mostrarConfirmar]="mostrarActivar"
  [titulo]="'Confirmar desactivación de '+ nombreActivar"
  [mensaje]="'¿Deseas Activar esta Unidad de Medida?'"
  [id]="idActivar!"
  (confirmarModal)="activarPorId($event)"
  (cerrarModal)="cerrarModalConfirmar()"
></app-confirmar-modal>
